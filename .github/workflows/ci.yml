name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run build
      - run: npm test
      - run: npm run verify
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check Windows installer without installing DSH
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
